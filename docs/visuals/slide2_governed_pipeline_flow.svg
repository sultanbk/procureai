      <text x="14" y="24" font-size="12" font-weight="700" fill="#2dd4bf">Context Substrate Graph Traversal</text>
      <text x="14" y="48" font-size="11" fill="#e2e8f0">• Queries Neo4j Concept Graph &amp; Milvus</text>
      <text x="14" y="70" font-size="11" fill="#e2e8f0">• Resolves <tspan fill="#f59e0b" font-weight="700">SUPERSEDES</tspan> Amendment chain</text>
      <text x="14" y="92" font-size="11" fill="#e2e8f0">• Deactivates stale/superseded rate clauses</text>
      <text x="14" y="114" font-size="11" fill="#e2e8f0">• Attaches governing rate card + cap nodes</text>

