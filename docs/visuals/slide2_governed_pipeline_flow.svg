      <text x="14" y="24" font-size="12" font-weight="700" fill="#f59e0b">Enterprise Sign-off Gate</text>
      <text x="14" y="48" font-size="11" fill="#e2e8f0">• Interactive Review on Procurement UI</text>
      <text x="14" y="70" font-size="11" fill="#e2e8f0">• Line-by-line Accept / Reject / Edit</text>
      <text x="14" y="92" font-size="11" fill="#e2e8f0">• One-Click ERP Webhook Sync</text>
      <text x="14" y="114" font-size="11" fill="#e2e8f0">• Ready-to-send dispute letter export</text>

      <rect x="14" y="128" width="260" height="24" rx="4" fill="#b45309" />
      <text x="144" y="144" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">No unverified changes sent to ERP</text>
    </g>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(60, 785)">
    <rect x="0" y="0" width="1480" height="50" rx="8" fill="#131b2c" stroke="#1e293b" />
    <text x="20" y="30" font-size="12" font-weight="700" fill="#94a3b8">KEY SYSTEM GUARANTEES:</text>
    
    <circle cx="210" cy="26" r="5" fill="#14b8a6" />
    <text x="222" y="30" font-size="11.5" fill="#cbd5e1"><tspan font-weight="600" fill="#5eead4">Synapt Substrate:</tspan> Epistemic graph walks prevent amendment traps</text>

    <circle cx="680" cy="26" r="5" fill="#6366f1" />
    <text x="692" y="30" font-size="11.5" fill="#cbd5e1"><tspan font-weight="600" fill="#a5b4fc">Zero-Math Engine:</tspan> Deterministic Python Decimal for all financials</text>

    <circle cx="1150" cy="26" r="5" fill="#f59e0b" />
    <text x="1162" y="30" font-size="11.5" fill="#cbd5e1"><tspan font-weight="600" fill="#fde68a">Enterprise Governance:</tspan> AP lead approves before ERP posting</text>
  </g>

</svg>
