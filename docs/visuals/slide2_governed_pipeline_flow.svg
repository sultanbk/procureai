  <g transform="translate(830, 520)">
    <rect x="0" y="0" width="330" height="240" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="330" height="40" rx="12" fill="#1e293b" />
    <rect x="0" y="30" width="330" height="10" fill="#1e293b" />
    <circle cx="24" cy="20" r="10" fill="#0284c7" />
    <text x="24" y="24" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <text x="44" y="24" font-size="13" font-weight="700" fill="#f8fafc">DRIFT ANALYZER</text>
    <rect x="235" y="10" width="80" height="20" rx="4" fill="#1e3a8a" />
    <text x="275" y="24" font-size="9.5" font-weight="700" fill="#93c5fd" text-anchor="middle">HISTORICAL</text>

    <!-- Details -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="298" height="162" rx="8" fill="#131b2c" stroke="#1e293b" />
      <text x="14" y="24" font-size="12" font-weight="600" fill="#60a5fa">Multi-Period Price Creep</text>
      <text x="14" y="48" font-size="11" fill="#cbd5e1">• Analyzes MoM unit rate progression</text>
      <text x="14" y="70" font-size="11" fill="#cbd5e1">• Baseline drift from Month 1 to Month N</text>
      <text x="14" y="92" font-size="11" fill="#cbd5e1">• Catches stealth margin expansion</text>
      <text x="14" y="114" font-size="11" fill="#cbd5e1">• Anomaly detection on unindexed items</text>

      <rect x="14" y="128" width="270" height="24" rx="4" fill="#172554" />
      <text x="149" y="144" font-size="10" font-weight="700" fill="#bfdbfe" text-anchor="middle">Stops Long-Term Spend Creep</text>
    </g>
  </g>

  <!-- Arrow 6 -> 7 -->
  <line x1="830" y1="640" x2="780" y2="640" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

