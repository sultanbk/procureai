  <g transform="translate(820, 180)">
    <rect x="0" y="0" width="340" height="240" rx="12" fill="url(#cardGrad)" stroke="#14b8a6" stroke-width="2" />
    <rect x="0" y="0" width="340" height="40" rx="12" fill="#134e4a" />
    <rect x="0" y="30" width="340" height="10" fill="#134e4a" />
    <circle cx="24" cy="20" r="10" fill="#14b8a6" />
    <text x="24" y="24" font-size="11" font-weight="700" fill="#042f2e" text-anchor="middle">3</text>
    <text x="44" y="24" font-size="13" font-weight="700" fill="#ccfbf1">SUBSTRATE ENRICHER (3b)</text>
