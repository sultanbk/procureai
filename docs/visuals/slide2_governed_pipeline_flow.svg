<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f30" />
      <stop offset="100%" stop-color="#0f1726" />
    </linearGradient>
    <linearGradient id="highlightTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="highlightIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="highlightAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#14b8a6" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Canvas Border & Title Area -->
  <rect x="20" y="20" width="1560" height="860" rx="16" fill="#0e1422" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Slide Header -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="180" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="90" y="17" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">SLIDE 2 ARCHITECTURE</text>
    <text x="0" y="60" font-size="26" font-weight="700" fill="#ffffff">Governed Multi-Agent Pipeline (8-Stage Stateful Workflow)</text>
    <text x="0" y="86" font-size="14" fill="#94a3b8">Autonomous contract-to-invoice compliance audit with deterministic zero-math guarantees and human sign-off.</text>
  </g>

  <!-- PIPELINE STAGES (Row 1: Stages 1 to 4) -->
  
  <!-- STAGE 1: Parallel Ingestion -->
  <g transform="translate(60, 180)">
    <rect x="0" y="0" width="320" height="240" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Header -->
    <rect x="0" y="0" width="320" height="40" rx="12" fill="#1e293b" />
    <rect x="0" y="30" width="320" height="10" fill="#1e293b" />
    <circle cx="24" cy="20" r="10" fill="#0284c7" />
    <text x="24" y="24" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="44" y="24" font-size="13" font-weight="700" fill="#f8fafc">PARALLEL INGESTION</text>
    <rect x="235" y="10" width="70" height="20" rx="4" fill="#0369a1" />
    <text x="270" y="24" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">ASYNC I/O</text>

    <!-- Sub-boxes -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="288" height="74" rx="8" fill="#131b2c" stroke="#1e293b" />
      <text x="14" y="22" font-size="12" font-weight="600" fill="#38bdf8">Contract Parser Agent</text>
      <text x="14" y="42" font-size="11" fill="#94a3b8">• PDF/Docx rate schedules &amp; SLAs</text>
      <text x="14" y="60" font-size="11" fill="#94a3b8">• Hierarchical clause &amp; tier extraction</text>
    </g>
    <g transform="translate(16, 144)">
      <rect x="0" y="0" width="288" height="74" rx="8" fill="#131b2c" stroke="#1e293b" />
      <text x="14" y="22" font-size="12" font-weight="600" fill="#38bdf8">Invoice Extractor Agent</text>
      <text x="14" y="42" font-size="11" fill="#94a3b8">• Gemini 3.7 Structured Output</text>
      <text x="14" y="60" font-size="11" fill="#94a3b8">• Dual-pass temperature consistency</text>
    </g>
  </g>

