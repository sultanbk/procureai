  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="320" height="240" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" />
    <rect x="0" y="0" width="320" height="40" rx="12" fill="#78350f" />
    <rect x="0" y="30" width="320" height="10" fill="#78350f" />
    <circle cx="24" cy="20" r="10" fill="#f59e0b" />
    <text x="24" y="24" font-size="11" font-weight="700" fill="#451a03" text-anchor="middle">8</text>
    <text x="44" y="24" font-size="13" font-weight="700" fill="#fef3c7">HUMAN IN THE LOOP</text>
    <rect x="220" y="10" width="85" height="20" rx="4" fill="#451a03" />
    <text x="262" y="24" font-size="9.5" font-weight="700" fill="#fbbf24" text-anchor="middle">GOVERNANCE</text>

    <!-- Details -->
    <g transform="translate(16, 56)">
