      <text x="14" y="48" font-size="11" fill="#cbd5e1">• Pure Python <tspan font-family="monospace" fill="#a5b4fc">Decimal</tspan> variance calc</text>
      <text x="14" y="70" font-size="11" fill="#cbd5e1">• Evaluates tier brackets &amp; caps</text>
      <text x="14" y="92" font-size="11" fill="#cbd5e1">• Critic reflection loop on high delta</text>
      <text x="14" y="114" font-size="11" fill="#cbd5e1">• Flags overcharges &amp; rate mismatches</text>

