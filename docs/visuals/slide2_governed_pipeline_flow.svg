      <text x="144" y="144" font-size="10" font-weight="700" fill="#e0e7ff" text-anchor="middle">Zero Math Hallucination Invariant</text>
    </g>
  </g>

  <!-- Connective Pipe from Row 1 to Row 2 -->
  <path d="M 1380 420 L 1380 470 L 1380 500" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

