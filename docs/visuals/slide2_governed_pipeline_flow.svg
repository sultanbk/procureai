    <text x="275" y="24" font-size="9.5" font-weight="700" fill="#bef264" text-anchor="middle">CFO-READY</text>

    <!-- Details -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="298" height="162" rx="8" fill="#131b2c" stroke="#1e293b" />
      <text x="14" y="24" font-size="12" font-weight="600" fill="#a3e635">Executive Audit Artifacts</text>
      <text x="14" y="48" font-size="11" fill="#cbd5e1">• Overcharge &amp; Discrepancy Breakdown</text>
      <text x="14" y="70" font-size="11" fill="#cbd5e1">• Formal Vendor Dispute Recovery Letter</text>
      <text x="14" y="92" font-size="11" fill="#cbd5e1">• Clause Citations with Page &amp; Section #</text>
      <text x="14" y="114" font-size="11" fill="#cbd5e1">• Interactive Reasoning Subgraph payload</text>

      <rect x="14" y="128" width="270" height="24" rx="4" fill="#14532d" />
      <text x="149" y="144" font-size="10" font-weight="700" fill="#dcfce7" text-anchor="middle">Complete Audit Explainability</text>
    </g>
  </g>

  <!-- Arrow 7 -> 8 -->
  <line x1="440" y1="640" x2="390" y2="640" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />

