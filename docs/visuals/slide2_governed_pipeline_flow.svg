  <line x1="380" y1="300" x2="430" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STAGE 2: Deterministic Cross-Validator Gate -->
  <g transform="translate(440, 180)">
    <rect x="0" y="0" width="320" height="240" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="40" rx="12" fill="#1e293b" />
    <rect x="0" y="30" width="320" height="10" fill="#1e293b" />
    <circle cx="24" cy="20" r="10" fill="#0284c7" />
    <text x="24" y="24" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="44" y="24" font-size="13" font-weight="700" fill="#f8fafc">CROSS-VALIDATOR GATE</text>
    <rect x="225" y="10" width="80" height="20" rx="4" fill="#0f766e" />
    <text x="265" y="24" font-size="9.5" font-weight="700" fill="#5eead4" text-anchor="middle">RULE-BASED</text>

    <!-- Details -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="288" height="162" rx="8" fill="#131b2c" stroke="#1e293b" />
      <text x="14" y="24" font-size="12" font-weight="600" fill="#5eead4">Deterministic Normalization</text>
      <text x="14" y="48" font-size="11" fill="#cbd5e1">✓ Fuzzy Vendor &amp; Entity Resolution</text>
      <text x="14" y="70" font-size="11" fill="#cbd5e1">✓ Unit Alignment (Hours, Mbps, GB, Qty)</text>
      <text x="14" y="92" font-size="11" fill="#cbd5e1">✓ Currency Conversion &amp; Baseline Lock</text>
      <text x="14" y="114" font-size="11" fill="#cbd5e1">✓ Header &amp; Metadata Sanity Validation</text>
      
      <rect x="14" y="128" width="260" height="24" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="144" y="144" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">Filters 100% of formatting errors</text>
    </g>
  </g>

