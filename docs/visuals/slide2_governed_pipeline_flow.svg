  <!-- STAGE 5: Reverse Sweep Engine -->
  <g transform="translate(1220, 520)">
    <rect x="0" y="0" width="320" height="240" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="40" rx="12" fill="#1e293b" />
    <rect x="0" y="30" width="320" height="10" fill="#1e293b" />
    <circle cx="24" cy="20" r="10" fill="#0284c7" />
    <text x="24" y="24" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="44" y="24" font-size="13" font-weight="700" fill="#f8fafc">REVERSE SWEEP</text>
    <rect x="215" y="10" width="90" height="20" rx="4" fill="#854d0e" />
    <text x="260" y="24" font-size="9.5" font-weight="700" fill="#fef08a" text-anchor="middle">PROACTIVE</text>

    <!-- Details -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="288" height="162" rx="8" fill="#131b2c" stroke="#1e293b" />
      <text x="14" y="24" font-size="12" font-weight="600" fill="#fbbf24">Contract-to-Invoice Audit</text>
      <text x="14" y="48" font-size="11" fill="#cbd5e1">• Hunts for promised credits vendor missed</text>
      <text x="14" y="70" font-size="11" fill="#cbd5e1">• Unapplied cumulative volume rebates</text>
      <text x="14" y="92" font-size="11" fill="#cbd5e1">• SLA downtime breach credit calculation</text>
      <text x="14" y="114" font-size="11" fill="#cbd5e1">• Early payment 2% discount check</text>

      <rect x="14" y="128" width="260" height="24" rx="4" fill="#451a03" />
      <text x="144" y="144" font-size="10" font-weight="700" fill="#fef3c7" text-anchor="middle">Catches &quot;Unbilled Rebates&quot;</text>
    </g>
  </g>

